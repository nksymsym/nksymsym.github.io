<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="さやまのウェブページ" />
    <title>しむしむはうす</title>
  </head>
  <body>
    <main class="home">
      <header class="home__header page-header">
        <h1 class="page-title">しむしむはうす</h1>
        <p class="page-description">なんか作って置く</p>
      </header>

      <section class="games" aria-labelledby="games-title">
        <h2 id="games-title" class="games__title">ゲーム</h2>

        <div class="games__grid">
          <a class="game-card" href="./games/minesweeper/">
            <img
              class="game-card__thumbnail"
              src="./src/images/thumbnail_minesweeper.webp"
              alt=""
            />

            <div class="game-card__body">
              <h3 class="game-card__title">狼なんか怖くない</h3>
              <p class="game-card__description">マインスイーパー</p>
            </div>
          </a>

          <a class="game-card" href="./games/waterflow/">
            <img
              class="game-card__thumbnail"
              src="./src/images/thumbnail_waterflow.webp"
              alt=""
            />

            <div class="game-card__body">
              <h3 class="game-card__title">お腰につけたきびだんご</h3>
              <p class="game-card__description">ピン抜きゲーム</p>
            </div>
          </a>
        </div>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
